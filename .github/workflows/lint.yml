name: lint

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Verificar sintaxe PHP
        run: |
          find . -name '*.php' -not -path './scratch/*' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null
